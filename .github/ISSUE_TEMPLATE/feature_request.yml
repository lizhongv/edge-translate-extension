name: 功能建议
description: 新功能或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
