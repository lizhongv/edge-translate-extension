name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build extension
        run: npm run build

      - name: Package dist as zip
        run: |
          cd dist
          zip -r ../edge-translate-extension-${GITHUB_REF_NAME}.zip .
          cd ..
          ls -lh edge-translate-extension-${GITHUB_REF_NAME}.zip

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -A 1 "^${GITHUB_REF_NAME}$" | tail -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF_NAME}" ]; then
            RANGE=""
            echo "First tag, listing all commits"
          else
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            echo "Range: $RANGE"
          fi
          {
            echo "changelog<<EOF"
            echo "## Changes"
            echo ""
            git log --pretty=format:"- %s" $RANGE
            echo ""
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download \`edge-translate-extension-${GITHUB_REF_NAME}.zip\` below"
            echo "2. Unzip it"
            echo "3. Open \`edge://extensions/\` (or \`chrome://extensions/\`), enable Developer mode"
            echo "4. Click 'Load unpacked' and select the unzipped folder"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: edge-translate-extension-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
