# 发布：推送 vX.Y.Z 标签时检查、构建并打包为应用商店可直接上传的 zip，发布到 GitHub Releases。
name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 检查（类型、代码、测试）
        run: npm run check

      - name: 构建
        run: npm run build

      - name: 打包 zip（可直接上传 Edge / Chrome 应用商店）
        run: |
          cd dist
          zip -r "../selectlingo-${GITHUB_REF_NAME}.zip" . -x "*.map"
          cd ..
          ls -lh "selectlingo-${GITHUB_REF_NAME}.zip"

      - name: 提取本版本更新说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo ""
            echo "## 安装"
            echo ""
            echo "1. 下载下方 \`selectlingo-${GITHUB_REF_NAME}.zip\` 并解压"
            echo "2. 打开 \`edge://extensions/\`（或 \`chrome://extensions/\`），开启「开发人员模式」"
            echo "3. 点击「加载解压缩的扩展」，选择解压后的文件夹"
          } >> RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          name: 划词译问 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: selectlingo-${{ github.ref_name }}.zip
