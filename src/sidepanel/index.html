<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>划词译问</title>
    <link rel="stylesheet" href="./sidepanel.css" />
</head>
<body>
    <header>
        <div class="brand">
            <img class="logo" src="/icons/48.png" alt="" />
            <span class="name">划词译问</span>
            <button id="open-options" class="icon-btn" type="button" title="设置" aria-label="设置">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            </button>
        </div>
        <nav class="tabs" aria-label="内容分类">
            <button class="tab active" data-tab="translate">翻译</button>
            <button class="tab" data-tab="qa">问答</button>
            <button class="tab" data-tab="memo">备忘录</button>
        </nav>
        <div class="tools">
            <button id="back" class="back" hidden>← 返回列表</button>
            <input id="memo-search" class="memo-search" type="search" placeholder="搜索标题或正文" hidden />
            <span class="spacer"></span>
            <button id="memo-export" class="memo-export" hidden>导出 Markdown</button>
            <button id="clear" class="danger-text">清空</button>
        </div>
    </header>

    <main>
        <section id="list-translate" class="view active"></section>
        <section id="list-qa" class="view"></section>
        <section id="detail-qa" class="view detail"></section>
        <section id="list-memo" class="view"></section>
        <section id="detail-memo" class="view detail"></section>
    </main>

    <template id="item-tpl">
        <article class="item">
            <div class="meta">
                <span class="time"></span>
                <span class="model"></span>
                <button class="del" title="删除">×</button>
            </div>
            <div class="src"></div>
            <div class="dst"></div>
            <div class="actions">
                <button class="copy-src">复制原文</button>
                <button class="copy-dst">复制译文</button>
            </div>
        </article>
    </template>

    <template id="qa-item-tpl">
        <article class="item qa-item">
            <div class="meta">
                <span class="time"></span>
                <span class="model"></span>
                <span class="turns"></span>
                <button class="del" title="删除">×</button>
            </div>
            <div class="src"></div>
            <div class="first-q"></div>
        </article>
    </template>

    <template id="qa-detail-tpl">
        <div class="qa-detail">
            <div class="source-row">
                <div class="label">原文</div>
                <div class="source-text"></div>
            </div>
            <div class="messages"></div>
            <div class="input-row">
                <textarea class="input" placeholder="继续追问…" rows="2"></textarea>
                <button class="send">↑</button>
            </div>
        </div>
    </template>

    <template id="memo-item-tpl">
        <article class="item memo-item">
            <div class="meta">
                <span class="icon"></span>
                <span class="time"></span>
                <button class="del" title="删除">×</button>
            </div>
            <div class="title"></div>
            <div class="preview"></div>
            <div class="source"></div>
        </article>
    </template>

    <template id="memo-detail-tpl">
        <div class="memo-detail">
            <label class="memo-title-label">标题
                <input type="text" class="memo-title-input" maxlength="100" />
            </label>
            <div class="memo-source-row">
                <span class="label">来源：</span>
                <a class="memo-source-link" target="_blank" rel="noopener"></a>
            </div>
            <label class="memo-content-label">正文
                <textarea class="memo-content-input" rows="14"></textarea>
            </label>
            <div class="memo-error" hidden></div>
            <div class="memo-buttons">
                <button class="memo-cancel">取消</button>
                <button class="memo-save">保存</button>
            </div>
        </div>
    </template>

    <script type="module" src="./index.ts"></script>
</body>
</html>
